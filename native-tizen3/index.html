<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mojangels AI TV</title><style>
html,body{margin:0;min-height:100%;background:#101b31;color:#f5f8ff;font-family:Arial,sans-serif}main{padding:3% 5%}h1{font-size:47px;margin:0 0 10px;color:#a9d8ff}p{font-size:23px;line-height:1.4;color:#ccd9e9}h2{font-size:34px}.sub{color:#b8c9de;font-size:21px}.tiles{max-width:1250px}.tile{display:inline-block;vertical-align:top;box-sizing:border-box;width:45%;min-height:140px;margin:0 2% 20px 0;padding:20px;background:#243752;color:#fff;border:4px solid #3c587c;border-radius:15px;text-align:left;font:26px Arial,sans-serif}.tile small{display:block;color:#b8d0e9;margin-top:12px;font-size:18px}button,input{font-family:Arial,sans-serif}button:focus,input:focus{outline:4px solid #ffdc78;outline-offset:2px}.tile:focus{border-color:#ffdc78;background:#365474}#message,.note{background:#1c2c45;padding:14px 19px;border-left:5px solid #8cbfff;font-size:21px;color:#e4eefc}#footer{font-size:17px;color:#b8c9de;margin-top:24px}.action{margin:10px 8px 10px 0;padding:13px 22px;font-size:21px;border:3px solid #658bad;border-radius:9px;color:white;background:#344d6a}#detail,#chat{display:none}.tag{color:#b5facf}.field{display:block;width:95%;box-sizing:border-box;margin:10px 0;padding:13px;font-size:23px;background:#eaf4ff;color:#14253a;border-radius:6px}label{font-size:21px}#history{height:215px;overflow:auto;background:#1c2c45;border:2px solid #526c8e;padding:12px;font-size:21px;white-space:pre-wrap}#status{font-size:19px;min-height:28px;color:#ffdf96}.muted{font-size:18px;color:#c9d7e9}
</style></head><body><main>
<header><h1>Mojangels AI TV</h1><div class="sub">Samsung Tizen 3.0 · Native TV assistant</div></header>
<div id="home"><div class="tiles">
<button class="tile" data-action="chat">AI Chat<small>Connect to a secure AI gateway</small></button>
<button class="tile" data-action="remote">Remote Control<small>Arrow keys, OK and Return</small></button>
<button class="tile" data-action="voice">Voice Assistant<small>Not available until hardware compatibility is verified</small></button>
<button class="tile" data-action="tv">TV Controls<small>Not enabled</small></button>
</div><div id="message">Use arrows to choose a tile and OK to open. Return goes back.</div></div>
<section id="detail"><h2 id="heading"></h2><p id="description"></p><p class="tag" id="feedback"></p><button class="action" id="back">Back to dashboard</button></section>
<section id="chat"><h2>AI Chat</h2><p class="muted">A private AI gateway is required. No API key is stored on the TV.</p>
<div id="setup"><label for="endpoint">HTTPS gateway address</label><input class="field" id="endpoint" placeholder="https://your-gateway.example" type="text" maxlength="240">
<label for="pin">Temporary pairing code from your gateway</label><input class="field" id="pin" placeholder="Pairing code" type="text" maxlength="12">
<button class="action" id="pair">Pair TV</button></div>
<div id="conversation" style="display:none"><div id="history" aria-live="polite"></div>
<label for="prompt">Message</label><input class="field" id="prompt" type="text" maxlength="1200" placeholder="Ask Mojangels something">
<button class="action" id="send">Send</button><button class="action" id="disconnect">Disconnect</button></div>
<div id="status" role="status"></div><button class="action" id="chatback">Back to dashboard</button></section>
<div id="footer">Mojangels AI TV v0.2 · AI connection is optional and not configured by default</div>
</main><script>
(function(){
'use strict';
var tiles=document.querySelectorAll('.tile'),home=document.getElementById('home'),detail=document.getElementById('detail'),chat=document.getElementById('chat'),heading=document.getElementById('heading'),description=document.getElementById('description'),feedback=document.getElementById('feedback'),back=document.getElementById('back'),active=0,screen='home',gateway='',session='',busy=false;
var pages={remote:['Remote Control','Use arrows to move between tiles, OK to select and Return to go home.'],voice:['Voice Assistant','Voice input is not enabled. Microphone access has not been verified on this TV.'],tv:['TV Controls','TV control commands are not available in this build.']};
function focusTile(i){active=(i+tiles.length)%tiles.length;tiles[active].focus();}
function showDetail(name){var p=pages[name];if(!p)return;heading.textContent=p[0];description.textContent=p[1];feedback.textContent=name==='remote'?'Remote OK selection works.':'Not yet enabled.';home.style.display='none';detail.style.display='block';screen='detail';back.focus();}
function showChat(){home.style.display='none';chat.style.display='block';screen='chat';document.getElementById(session?'prompt':'endpoint').focus();}
function goHome(){detail.style.display='none';chat.style.display='none';home.style.display='block';screen='home';focusTile(active);}
function status(s){document.getElementById('status').textContent=s;}
function xhr(method,path,data,cb){if(!gateway){cb('Set the gateway address first.');return;}var req=new XMLHttpRequest();req.open(method,gateway+path,true);req.timeout=20000;req.setRequestHeader('Content-Type','application/json');if(session)req.setRequestHeader('Authorization','Bearer '+session);req.onreadystatechange=function(){if(req.readyState===4){var res={};try{res=JSON.parse(req.responseText);}catch(e){}if(req.status<200||req.status>=300){cb(res.error||('Gateway request failed ('+req.status+').'));}else{cb(null,res);}}};req.onerror=function(){cb('Could not connect securely to the gateway.');};req.ontimeout=function(){cb('Gateway request timed out.');};req.send(JSON.stringify(data));}
function log(who,t){var h=document.getElementById('history');h.textContent+=who+': '+t+'\n\n';h.scrollTop=h.scrollHeight;}
for(var i=0;i<tiles.length;i++){(function(n){tiles[n].onclick=function(){active=n;var action=tiles[n].getAttribute('data-action');if(action==='chat')showChat();else showDetail(action);};tiles[n].onfocus=function(){active=n;};})(i);}
back.onclick=goHome;document.getElementById('chatback').onclick=goHome;
document.getElementById('pair').onclick=function(){if(busy)return;var value=document.getElementById('endpoint').value.replace(/\/+$/,'');var code=document.getElementById('pin').value.trim();if(!/^https:\/\/[^\s/]+(?:\/[^\s]*)?$/.test(value)){status('Use a valid HTTPS gateway URL.');return;}if(!/^[0-9]{6}$/.test(code)){status('Enter the six-digit pairing code.');return;}gateway=value;busy=true;status('Pairing…');xhr('POST','/api/pair',{code:code},function(err,res){busy=false;if(err){status(err);return;}if(!res.token){status('Gateway did not return a session.');return;}session=res.token;document.getElementById('pin').value='';document.getElementById('setup').style.display='none';document.getElementById('conversation').style.display='block';status('Connected.');document.getElementById('prompt').focus();});};
document.getElementById('send').onclick=function(){if(busy||!session)return;var inp=document.getElementById('prompt'),message=inp.value.trim();if(!message)return;busy=true;inp.value='';log('You',message);status('Thinking…');xhr('POST','/api/chat',{message:message},function(err,res){busy=false;if(err){status(err);return;}log('Mojangels',String(res.answer||'(No response)'));status('Ready.');inp.focus();});};
document.getElementById('disconnect').onclick=function(){session='';gateway='';document.getElementById('conversation').style.display='none';document.getElementById('setup').style.display='block';document.getElementById('history').textContent='';status('Disconnected.');document.getElementById('endpoint').focus();};
document.addEventListener('keydown',function(e){var c=e.keyCode;if(c===10009||c===8&&e.target.tagName!=='INPUT'){if(screen!=='home'){goHome();e.preventDefault();}return;}if(screen==='chat'){
var ids=session?['prompt','send','disconnect','chatback']:['endpoint','pin','pair','chatback'];
var elements=ids.map(function(id){return document.getElementById(id);});
var k=elements.indexOf(document.activeElement);
if(c===38||c===40){elements[(k+(c===40?1:elements.length-1))%elements.length].focus();e.preventDefault();}
return;
}
if(screen!=='home')return;if(c===37){focusTile(active-1);e.preventDefault();}else if(c===39){focusTile(active+1);e.preventDefault();}else if(c===38){focusTile(active-2);e.preventDefault();}else if(c===40){focusTile(active+2);e.preventDefault();}else if(c===13){tiles[active].click();e.preventDefault();}});
focusTile(0);
})();
</script></body></html>
